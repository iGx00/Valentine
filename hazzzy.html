<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine 💘</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Arial', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        .buttons {
            margin-top: 30px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background: #e91e63;
            color: white;
            margin-right: 15px;
        }

        #yesBtn:hover {
            background: #d81b60;
        }

        #noBtn {
            background: #ccc;
            color: #333;
            position: absolute;
        }

        .heart {
            font-size: 30px;
            animation: float 2s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">💖</div>
        <h1>Hey Beautiful</h1>
        <p>
            I was wondering…<br>
            would you make me the happiest person<br>
            and be my Valentine? 🌹
        </p>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveNo()">No 🙈</button>
        </div>
    </div>

    <script>
        function sayYes() {
            document.body.innerHTML = `
                <div style="
                    height:100vh;
                    display:flex;
                    flex-direction:column;
                    justify-content:center;
                    align-items:center;
                    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
                    font-family: Arial;
                    text-align:center;
                ">
                    <h1 style="color:#e91e63;">Yaaay!!! 💘🎉</h1>
                    <p style="font-size:22px;">
                        I can't wait to celebrate Valentine’s with you 🌹<br>
                        You just made my day ❤️
                    </p>
                </div>
            `;
        }

        function moveNo() {
            const noBtn = document.getElementById("noBtn");
            const x = Math.random() * 250;
            const y = Math.random() * 40;
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }
    </script>

</body>
</html>
